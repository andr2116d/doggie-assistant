# DOGGIE configuration example.
#
# Copy it to ~/.config/doggie/config.yaml (or $XDG_CONFIG_HOME/doggie/config.yaml)
# and adjust it. Keep secrets out of this file.

owner:
  # How DOGGIE addresses you.
  name: "Alex"
  # What DOGGIE should always know about you, in any language (max 8 KB).
  about: |
    Lives in Lisbon. Likes sci-fi movies and early mornings.

assistant:
  name: "DOGGIE"
  # How DOGGIE talks and behaves, in any language (max 8 KB).
  persona: |
    A calm butler with a dry sense of humor. Brief and warm.

# Language DOGGIE speaks and understands (BCP 47: en, es, ...).
language: "en"

log:
  # debug | info | warn | error
  level: "info"

bus:
  # Where satellites connect (they need the bus token). "" = in-process only.
  # Use "0.0.0.0:4222" to accept connections from your LAN.
  # The token comes from $DOGGIE_BUS_TOKEN, or is generated on first run in
  # $XDG_DATA_HOME/doggie/bus.token.
  listen: "127.0.0.1:4222"
  # TLS for TCP clients, with certificates from DOGGIE's own CA in
  # $XDG_DATA_HOME/doggie/tls. Satellites on other machines need ca.pem
  # (or $DOGGIE_BUS_CA pointing to it) plus the token.
  tls:
    enabled: true
    # Names/IPs to add to the server certificate beyond the detected ones
    # (localhost, hostname, interface IPs), e.g. a Tailscale MagicDNS name.
    extra_hosts: []
  # Persistent log of every event (JetStream). Oldest events are dropped first.
  event_log:
    max_age: "168h"
    max_size_mb: 512

brain:
  # LLM provider. Only "claudecode" (the official Claude Code CLI, using your
  # subscription login) for now.
  provider: "claudecode"
  # Model name or alias for the provider.
  model: "sonnet"
  # Recent turns of a conversation thread included in every prompt.
  history_turns: 20
  # Upper bound for one turn of the LLM, tool calls included (5s-10m).
  turn_timeout: "90s"
  # LLM processes kept started ahead, so a turn needn't wait for one (0-4).
  # One per turn that may run at once; each takes about 200 MB of memory.
  warm: 2
  claudecode:
    # The claude executable. Use an absolute path if it is not in PATH (e.g.
    # when DOGGIE runs as a service).
    command: "claude"
